<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — School Timetabler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE0;
    --paper-alt:#EAE3D0;
    --ink:#24211B;
    --ink-soft:#5B564A;
    --board:#1F3B34;
    --board-soft:#2C4C43;
    --gold:#C79A3D;
    --gold-soft:#E4C878;
    --brick:#A8412F;
    --line:#D9D0B8;
    --white:#FFFDF7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;
  }
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    margin:0 0 4px 0;
    color:var(--board);
  }
  .app{display:flex; min-height:100vh;}
  .rail{
    width:180px; flex-shrink:0;
    background:var(--board);
    color:var(--paper);
    padding:20px 0;
  }
  .rail .brand{
    font-family:Georgia,serif; font-size:17px; font-weight:700;
    padding:0 18px 18px 18px; border-bottom:1px solid rgba(255,255,255,.15);
    margin-bottom:8px; color:var(--gold-soft);
  }
  .rail .brand small{display:block; font-size:10px; letter-spacing:.04em; color:rgba(243,238,224,.55); font-family:-apple-system,sans-serif; margin-top:2px;}
  .tab-btn{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:rgba(243,238,224,.8); padding:10px 18px; font-size:13.5px; cursor:pointer;
    border-left:3px solid transparent;
  }
  .tab-btn:hover{background:rgba(255,255,255,.06); color:var(--paper);}
  .tab-btn.active{border-left-color:var(--gold); background:rgba(255,255,255,.08); color:var(--gold-soft); font-weight:600;}
  .main{flex:1; padding:26px 32px; max-width:1100px;}
  .subtabs{display:flex; gap:6px; margin:14px 0 18px 0; flex-wrap:wrap;}
  .subtab-btn{
    background:var(--white); border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 14px; border-radius:3px; font-size:12.5px; cursor:pointer;
  }
  .subtab-btn.active{background:var(--board); color:var(--paper); border-color:var(--board);}
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:4px;
    padding:18px 20px; margin-bottom:16px;
  }
  .card + .card{margin-top:0;}
  .field-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:10px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  input[type=text], input[type=number], select{
    border:1px solid var(--line); border-radius:3px; padding:6px 8px; font-size:13px;
    background:var(--paper); color:var(--ink); min-width:120px;
  }
  input[type=checkbox]{transform:scale(1.1); margin-right:4px;}
  .checkfield{display:flex; align-items:center; font-size:12.5px; color:var(--ink-soft); gap:2px; padding-bottom:6px;}
  button.btn{
    background:var(--board); color:var(--paper); border:none; border-radius:3px;
    padding:7px 16px; font-size:13px; cursor:pointer;
  }
  button.btn:hover{background:var(--board-soft);}
  button.btn.gold{background:var(--gold); color:var(--board); font-weight:700;}
  button.btn.gold:hover{background:var(--gold-soft);}
  button.btn.ghost{background:transparent; color:var(--brick); border:1px solid var(--brick); padding:5px 10px; font-size:12px;}
  button.btn.small{padding:4px 10px; font-size:12px;}
  table.list{width:100%; border-collapse:collapse; margin-top:6px;}
  table.list th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); border-bottom:1px solid var(--line); padding:6px 8px;
  }
  table.list td{padding:7px 8px; border-bottom:1px solid var(--paper-alt); font-size:13px;}
  .tag{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--paper-alt); color:var(--ink-soft); margin-left:6px;}
  .tag.early{background:#E6E9DE; color:#4A5D3A;}
  .tag.maths{background:#E9DCC7; color:#8A5A22;}
  .tag.ppi{background:#DCE3E8; color:#2C4C6B;}
  .tag.dbl{background:#F0DCD6; color:var(--brick);}
  .hint{font-size:12px; color:var(--ink-soft); margin:4px 0 12px 0; line-height:1.5;}
  .warn{background:#F6E7E2; border:1px solid #E3B7A8; color:var(--brick); padding:10px 14px; border-radius:4px; font-size:12.5px; margin-bottom:14px;}
  .ok{background:#E8EEE4; border:1px solid #B9CDA9; color:#3E5A2C; padding:10px 14px; border-radius:4px; font-size:12.5px; margin-bottom:14px;}
  .tt-wrap{overflow-x:auto;}
  table.tt{border-collapse:collapse; width:100%; min-width:560px;}
  table.tt th, table.tt td{border:1px solid var(--line); padding:6px 8px; font-size:12px; text-align:center; vertical-align:middle;}
  table.tt th{background:var(--board); color:var(--paper); font-weight:600; font-size:11px;}
  table.tt td.period-label{background:var(--paper-alt); font-weight:600; color:var(--ink-soft); white-space:nowrap; text-align:left;}
  table.tt td.lunch{background:#EFE3C6; color:#8A6B22; font-weight:700; letter-spacing:.03em; font-size:11px;}
  table.tt td.cell{background:var(--white);}
  table.tt td.cell .s{font-weight:600; display:block;}
  table.tt td.cell .t{color:var(--ink-soft); font-size:10.5px; display:block;}
  table.tt td.cell.ppi{background:#DCE3E8;}
  table.tt td.empty{color:var(--line);}
  select.picker{margin-bottom:14px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .rules-box{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .rules-box b{color:var(--board);}

  /* ---- Login screen ---- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--board);
  }
  .login-card{
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:32px 34px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .login-card h1{font-size:19px; margin-bottom:2px;}
  .login-card .sub{font-size:12px; color:var(--ink-soft); margin-bottom:18px;}
  .login-card .field{width:100%; margin-bottom:12px;}
  .login-card input{width:100%;}
  .login-card button.btn{width:100%; margin-top:4px;}
  .login-switch{font-size:12px; color:var(--ink-soft); margin-top:14px; text-align:center;}
  .login-switch a{color:var(--board); cursor:pointer; text-decoration:underline;}
  .login-msg{font-size:12px; padding:8px 10px; border-radius:3px; margin-bottom:10px;}
  .login-msg.err{background:#F6E7E2; color:var(--brick);}
  .login-msg.ok{background:#E8EEE4; color:#3E5A2C;}
  .rail .who{padding:12px 18px; border-top:1px solid rgba(255,255,255,.15); margin-top:10px; font-size:11.5px; color:rgba(243,238,224,.7);}
  .rail .who .email{display:block; font-weight:600; color:var(--gold-soft); margin-bottom:6px; word-break:break-all;}
  .rail .who button{width:100%;}

  /* ---- Print ---- */
  #print-area{display:none;}
  .print-page{margin-bottom:26px;}
  .print-page h2{font-size:16px; margin-bottom:10px;}
  @media print{
    .app{display:none !important;}
    #login-screen{display:none !important;}
    #print-area{display:block !important;}
    .print-page{page-break-after:always;}
    .print-page:last-child{page-break-after:auto;}
  }
</style>
</head>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <h1>The Ledger</h1>
    <div class="sub">Admin sign-in — School Timetabler</div>
    <div id="login-msg-box"></div>
    <div class="field"><input type="text" id="login-email" placeholder="Email"></div>
    <div class="field"><input type="password" id="login-password" placeholder="Password"></div>
    <button class="btn gold" id="login-submit">Sign in</button>
    <div class="login-switch" id="login-switch">No admin account yet? <a id="to-signup">Create one</a></div>
  </div>
</div>

<div class="app" id="app-root" style="display:none;">
  <div class="rail">
    <div class="brand">The Ledger<small>School Timetabler</small></div>
    <button class="tab-btn active" data-tab="structure">Term Structure</button>
    <button class="tab-btn" data-tab="classes">Classes</button>
    <button class="tab-btn" data-tab="subjects">Subjects</button>
    <button class="tab-btn" data-tab="teachers">Teachers</button>
    <button class="tab-btn" data-tab="assignments">Assignments</button>
    <button class="tab-btn" data-tab="generate">Generate</button>
    <button class="tab-btn" data-tab="results">Timetables</button>
    <div class="who">
      <span class="email" id="who-email"></span>
      <button class="btn ghost" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="print-area"></div>

<script>
// ---------- AUTH (Supabase) ----------
const SUPABASE_URL = 'https://yfkvqgvchnuopnietlbb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5h5M9eLmTawfIWY_R8vYfQ_zMxdNjcq';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let authMode = 'signin'; // 'signin' | 'signup'

function showLoginMsg(text, type){
  const box = document.getElementById('login-msg-box');
  box.innerHTML = text ? `<div class="login-msg ${type}">${text}</div>` : '';
}

function renderLoginMode(){
  document.querySelector('#login-screen h1').nextSibling; // no-op, keeps structure stable
  const submitBtn = document.getElementById('login-submit');
  const switchEl = document.getElementById('login-switch');
  if(authMode==='signin'){
    submitBtn.textContent = 'Sign in';
    switchEl.innerHTML = 'No admin account yet? <a id="to-signup">Create one</a>';
    document.getElementById('to-signup').onclick = ()=>{ authMode='signup'; showLoginMsg('',''); renderLoginMode(); };
  } else {
    submitBtn.textContent = 'Create admin account';
    switchEl.innerHTML = 'Already have an account? <a id="to-signin">Sign in</a>';
    document.getElementById('to-signin').onclick = ()=>{ authMode='signin'; showLoginMsg('',''); renderLoginMode(); };
  }
}

async function handleAuthSubmit(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if(!email || !password){ showLoginMsg('Enter both an email and password.', 'err'); return; }
  showLoginMsg('', '');
  if(authMode==='signin'){
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error){ showLoginMsg(error.message, 'err'); return; }
    await onAuthed();
  } else {
    const {data, error} = await sb.auth.signUp({email, password});
    if(error){ showLoginMsg(error.message, 'err'); return; }
    if(data.session){
      await onAuthed();
    } else {
      showLoginMsg('Account created. Check your email to confirm, then sign in.', 'ok');
      authMode = 'signin'; renderLoginMode();
    }
  }
}

async function onAuthed(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showLoginScreen(); return; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-root').style.display = 'flex';
  document.getElementById('who-email').textContent = session.user.email || '';
  await loadState();
  render();
}

function showLoginScreen(){
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  renderLoginMode();
}

async function initAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ await onAuthed(); } else { showLoginScreen(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){ showLoginScreen(); }
  });
}

// ---------- STATE ----------
let state = null;

function uid(){ return Math.random().toString(36).slice(2,9); }

function seedState(){
  const classes = [
    {id:uid(), name:'Play Group', category:'early'},
    {id:uid(), name:'PP1', category:'early'},
    {id:uid(), name:'PP2', category:'early'},
    {id:uid(), name:'Grade 1', category:'regular'},
    {id:uid(), name:'Grade 2', category:'regular'},
  ];
  const subjects = [
    {id:uid(), name:'PPI', weekly:1, double:false, maths:false, ppi:true},
    {id:uid(), name:'Mathematics', weekly:5, double:false, maths:true, ppi:false},
    {id:uid(), name:'English', weekly:5, double:false, maths:false, ppi:false},
    {id:uid(), name:'Science', weekly:4, double:true, maths:false, ppi:false},
    {id:uid(), name:'Social Studies', weekly:3, double:false, maths:false, ppi:false},
    {id:uid(), name:'Creative Arts', weekly:2, double:true, maths:false, ppi:false},
    {id:uid(), name:'Physical Education', weekly:2, double:false, maths:false, ppi:false},
  ];
  const teachers = [
    {id:uid(), name:'Mrs. Achieng'},
    {id:uid(), name:'Mr. Otieno'},
    {id:uid(), name:'Ms. Wanjiru'},
    {id:uid(), name:'Mr. Kiptoo'},
    {id:uid(), name:'Mrs. Nduta'},
  ];
  const byName = n => subjects.find(s=>s.name===n).id;
  const t = i => teachers[i].id;
  const assignments = [];
  classes.forEach((c, ci) => {
    assignments.push({id:uid(), classId:c.id, subjectId:byName('PPI'), teacherId:t(ci%5), weekly:1});
    assignments.push({id:uid(), classId:c.id, subjectId:byName('Mathematics'), teacherId:t((ci+1)%5), weekly:5});
    assignments.push({id:uid(), classId:c.id, subjectId:byName('English'), teacherId:t((ci+2)%5), weekly:5});
    assignments.push({id:uid(), classId:c.id, subjectId:byName('Creative Arts'), teacherId:t((ci+3)%5), weekly:2});
    assignments.push({id:uid(), classId:c.id, subjectId:byName('Physical Education'), teacherId:t((ci+4)%5), weekly:2});
    if(c.category==='regular'){
      assignments.push({id:uid(), classId:c.id, subjectId:byName('Science'), teacherId:t((ci+1)%5), weekly:4});
      assignments.push({id:uid(), classId:c.id, subjectId:byName('Social Studies'), teacherId:t((ci+2)%5), weekly:3});
    }
  });
  return {
    structure:{ days:['Mon','Tue','Wed','Thu','Fri'], periodsPerDay:8, lunchAfter:4 },
    classes, subjects, teachers, assignments,
    schedule:null
  };
}

async function loadState(){
  try{
    const {data, error} = await sb.from('timetabler_state').select('data').maybeSingle();
    if(error) throw error;
    if(data && data.data){ state = data.data; return; }
  }catch(e){ console.warn('load failed, seeding fresh state', e); }
  state = seedState();
  await saveState();
}
async function saveState(){
  try{
    const {error} = await sb.from('timetabler_state')
      .upsert({ data: state, updated_at: new Date().toISOString() }, { onConflict:'owner_id' });
    if(error) console.warn('save failed', error);
  }catch(e){ console.warn('save failed', e); }
}

// ---------- HELPERS ----------
function classById(id){ return state.classes.find(c=>c.id===id); }
function subjById(id){ return state.subjects.find(s=>s.id===id); }
function teacherById(id){ return state.teachers.find(t=>t.id===id); }
function findFridayIndex(){
  const i = state.days_cache_idx;
  const idx = state.structure.days.findIndex(d=>/fri/i.test(d));
  return idx>=0? idx : state.structure.days.length-1;
}

// ---------- SCHEDULER ----------
function generateSchedule(){
  const {days, periodsPerDay, lunchAfter} = state.structure;
  const fridayIdx = findFridayIndex();
  const fridayName = days[fridayIdx];

  function attempt(){
    const classGrid = {};   // classId -> day -> period -> {subjectId, teacherId}
    const teacherBusy = {}; // teacherId -> day -> period -> true
    state.classes.forEach(c=>{ classGrid[c.id]={}; days.forEach(d=>classGrid[c.id][d]={}); });
    state.teachers.forEach(t=>{ teacherBusy[t.id]={}; days.forEach(d=>teacherBusy[t.id][d]={}); });
    const unscheduled = [];

    function allowedPeriods(cls, subj){
      const early = cls.category==='early';
      const beforeLunchOnly = early || subj.maths;
      const arr = [];
      for(let p=1;p<=periodsPerDay;p++){
        if(beforeLunchOnly && p>lunchAfter) continue;
        arr.push(p);
      }
      return arr;
    }

    // Step 1: PPI forced to Friday, period 1
    state.assignments.filter(a=>subjById(a.subjectId).ppi).forEach(a=>{
      const tid = a.teacherId;
      if(teacherBusy[tid][fridayName][1]){
        unscheduled.push({classId:a.classId, subjectId:a.subjectId, reason:`Teacher clash: ${teacherById(tid).name} already teaches PPI to another class first period Friday.`});
        return;
      }
      classGrid[a.classId][fridayName][1] = {subjectId:a.subjectId, teacherId:tid};
      teacherBusy[tid][fridayName][1] = true;
    });

    // Step 2: build task list for all non-PPI assignments
    let tasks = [];
    state.assignments.filter(a=>!subjById(a.subjectId).ppi).forEach(a=>{
      const subj = subjById(a.subjectId);
      const weekly = a.weekly || subj.weekly;
      const units = [];
      if(subj.double && weekly>=2){
        const numDoubles = Math.floor(weekly/2);
        const singles = weekly % 2;
        for(let i=0;i<numDoubles;i++) units.push(2);
        for(let i=0;i<singles;i++) units.push(1);
      } else {
        for(let i=0;i<weekly;i++) units.push(1);
      }
      units.forEach(len=>tasks.push({classId:a.classId, subjectId:a.subjectId, teacherId:a.teacherId, len}));
    });
    // shuffle
    for(let i=tasks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tasks[i],tasks[j]]=[tasks[j],tasks[i]]; }
    // place doubles first (harder to fit), then singles
    tasks.sort((a,b)=>b.len-a.len);

    tasks.forEach(task=>{
      const cls = classById(task.classId);
      const subj = subjById(task.subjectId);
      const allowed = allowedPeriods(cls, subj);
      const shuffledDays = [...days].sort(()=>Math.random()-0.5);
      let placed = false;
      for(const day of shuffledDays){
        // avoid the same subject twice on the same day for this class
        const already = Object.values(classGrid[task.classId][day]).some(c=>c && c.subjectId===task.subjectId);
        if(already) continue;
        const shuffledStarts = [...allowed].sort(()=>Math.random()-0.5);
        for(const p of shuffledStarts){
          if(p+task.len-1 > periodsPerDay) continue;
          if(task.len===2 && p<=lunchAfter && (p+1)>lunchAfter) continue; // no straddling lunch
          let ok = true;
          for(let i=0;i<task.len;i++){
            const per = p+i;
            if(!allowed.includes(per)){ ok=false; break; }
            if(classGrid[task.classId][day][per]){ ok=false; break; }
            if(teacherBusy[task.teacherId][day][per]){ ok=false; break; }
          }
          if(ok){
            for(let i=0;i<task.len;i++){
              const per = p+i;
              classGrid[task.classId][day][per] = {subjectId:task.subjectId, teacherId:task.teacherId};
              teacherBusy[task.teacherId][day][per] = true;
            }
            placed = true;
            break;
          }
        }
        if(placed) break;
      }
      if(!placed){
        unscheduled.push({classId:task.classId, subjectId:task.subjectId, reason:`Could not find a clash-free ${task.len===2?'double':'single'} slot within the allowed periods.`});
      }
    });

    return {classGrid, teacherBusy, unscheduled};
  }

  let best = null;
  const ATTEMPTS = 25;
  for(let i=0;i<ATTEMPTS;i++){
    const res = attempt();
    if(!best || res.unscheduled.length < best.unscheduled.length) best = res;
    if(best.unscheduled.length===0) break;
  }
  state.schedule = { classGrid: best.classGrid, unscheduled: best.unscheduled, generatedAt: new Date().toISOString() };
  saveState();
}

// ---------- RENDERING ----------
let currentTab = 'structure';
let currentResultsSub = 'block';
let selectedClassId = null;
let selectedTeacherId = null;

function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

function render(){
  const main = document.getElementById('main');
  if(currentTab==='structure') main.innerHTML = renderStructure();
  else if(currentTab==='classes') main.innerHTML = renderClasses();
  else if(currentTab==='subjects') main.innerHTML = renderSubjects();
  else if(currentTab==='teachers') main.innerHTML = renderTeachers();
  else if(currentTab==='assignments') main.innerHTML = renderAssignments();
  else if(currentTab==='generate') main.innerHTML = renderGenerate();
  else if(currentTab==='results') main.innerHTML = renderResults();
  attachHandlers();
}

function renderStructure(){
  const s = state.structure;
  return `
  <h1>Term structure</h1>
  <div class="hint">Set the shape of the school week. Lunch sits after the period you choose — periods after that are treated as "after lunch" for the placement rules.</div>
  <div class="card">
    <div class="field-row">
      <div class="field"><label>Days (comma separated)</label><input type="text" id="f-days" value="${s.days.join(', ')}" style="min-width:280px"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Periods per day</label><input type="number" id="f-periods" value="${s.periodsPerDay}" min="4" max="12"></div>
      <div class="field"><label>Lunch break after period #</label><input type="number" id="f-lunch" value="${s.lunchAfter}" min="1" max="${s.periodsPerDay-1}"></div>
    </div>
    <button class="btn gold" id="save-structure">Save structure</button>
  </div>
  <div class="card rules-box">
    <b>Rules always applied when generating:</b><br>
    1. PPI is placed as the first lesson every Friday, in every class.<br>
    2. Early-years classes (marked "early" in Classes) get no lessons after the lunch break.<br>
    3. Any subject marked "before lunch" (e.g. Mathematics) is only placed before lunch.<br>
    4. Subjects marked "allow doubles" are scheduled as consecutive double periods where their weekly count allows it.<br>
    5. No teacher is ever placed in two classes at the same time.
  </div>`;
}

function renderClasses(){
  const rows = state.classes.map(c=>`
    <tr>
      <td>${c.name}</td>
      <td>${c.category==='early' ? '<span class="tag early">early years</span>' : '<span class="tag">regular</span>'}</td>
      <td><button class="btn ghost small" data-del-class="${c.id}">Remove</button></td>
    </tr>`).join('');
  return `
  <h1>Classes</h1>
  <div class="hint">Mark a class "early years" if lessons must stop at lunch (Play Group, PP1, PP2, etc).</div>
  <div class="card">
    <div class="field-row">
      <div class="field"><label>Class name</label><input type="text" id="f-class-name" placeholder="e.g. Grade 3"></div>
      <div class="field"><label>Category</label>
        <select id="f-class-cat"><option value="regular">Regular</option><option value="early">Early years</option></select>
      </div>
      <button class="btn gold" id="add-class">Add class</button>
    </div>
    <table class="list"><tr><th>Name</th><th>Category</th><th></th></tr>${rows || '<tr><td colspan=3 style="color:var(--ink-soft)">No classes yet.</td></tr>'}</table>
  </div>`;
}

function renderSubjects(){
  const rows = state.subjects.map(s=>`
    <tr>
      <td>${s.name}</td>
      <td>${s.weekly}</td>
      <td>${s.double?'Yes':'—'}</td>
      <td>${s.maths?'Yes':'—'}</td>
      <td>${s.ppi?'Yes':'—'}</td>
      <td><button class="btn ghost small" data-del-subject="${s.id}">Remove</button></td>
    </tr>`).join('');
  return `
  <h1>Subjects</h1>
  <div class="hint">Flag "before lunch" for subjects like Mathematics. Flag "PPI" for the Friday pastoral slot (weekly count is forced to 1 and placed automatically). Flag "allow doubles" to let a subject run as back-to-back periods.</div>
  <div class="card">
    <div class="field-row">
      <div class="field"><label>Subject name</label><input type="text" id="f-subj-name" placeholder="e.g. Mathematics"></div>
      <div class="field"><label>Weekly lessons</label><input type="number" id="f-subj-weekly" value="4" min="1" max="15"></div>
      <div class="checkfield"><input type="checkbox" id="f-subj-double"> Allow doubles</div>
      <div class="checkfield"><input type="checkbox" id="f-subj-maths"> Must be before lunch</div>
      <div class="checkfield"><input type="checkbox" id="f-subj-ppi"> This is PPI</div>
      <button class="btn gold" id="add-subject">Add subject</button>
    </div>
    <table class="list"><tr><th>Name</th><th>Weekly</th><th>Doubles</th><th>Before lunch</th><th>PPI</th><th></th></tr>
      ${rows || '<tr><td colspan=6 style="color:var(--ink-soft)">No subjects yet.</td></tr>'}
    </table>
  </div>`;
}

function renderTeachers(){
  const rows = state.teachers.map(t=>`
    <tr><td>${t.name}</td><td><button class="btn ghost small" data-del-teacher="${t.id}">Remove</button></td></tr>`).join('');
  return `
  <h1>Teachers</h1>
  <div class="card">
    <div class="field-row">
      <div class="field"><label>Teacher name</label><input type="text" id="f-teacher-name" placeholder="e.g. Mr. Otieno"></div>
      <button class="btn gold" id="add-teacher">Add teacher</button>
    </div>
    <table class="list"><tr><th>Name</th><th></th></tr>${rows || '<tr><td colspan=2 style="color:var(--ink-soft)">No teachers yet.</td></tr>'}</table>
  </div>`;
}

function renderAssignments(){
  if(state.classes.length===0 || state.subjects.length===0 || state.teachers.length===0){
    return `<h1>Assignments</h1><div class="warn">Add at least one class, one subject and one teacher first.</div>`;
  }
  const classOpts = state.classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const subjOpts = state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const teacherOpts = state.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

  const rows = state.assignments.map(a=>{
    const c = classById(a.classId), s = subjById(a.subjectId), t = teacherById(a.teacherId);
    if(!c||!s||!t) return '';
    return `<tr>
      <td>${c.name}</td>
      <td>${s.name}${s.ppi?' <span class="tag ppi">PPI</span>':''}${s.maths?' <span class="tag maths">before lunch</span>':''}${s.double?' <span class="tag dbl">doubles</span>':''}</td>
      <td>${t.name}</td>
      <td>${s.ppi ? 1 : (a.weekly||s.weekly)}</td>
      <td><button class="btn ghost small" data-del-assign="${a.id}">Remove</button></td>
    </tr>`;
  }).join('');

  return `
  <h1>Assignments</h1>
  <div class="hint">Assign which teacher takes which subject, for which class. Weekly lesson count defaults to the subject's setting but can be overridden here.</div>
  <div class="card">
    <div class="field-row">
      <div class="field"><label>Class</label><select id="f-a-class">${classOpts}</select></div>
      <div class="field"><label>Subject</label><select id="f-a-subject">${subjOpts}</select></div>
      <div class="field"><label>Teacher</label><select id="f-a-teacher">${teacherOpts}</select></div>
      <div class="field"><label>Weekly (override)</label><input type="number" id="f-a-weekly" min="1" max="15" placeholder="default"></div>
      <button class="btn gold" id="add-assignment">Add assignment</button>
    </div>
    <table class="list"><tr><th>Class</th><th>Subject</th><th>Teacher</th><th>Weekly</th><th></th></tr>
      ${rows || '<tr><td colspan=5 style="color:var(--ink-soft)">No assignments yet.</td></tr>'}
    </table>
  </div>`;
}

function renderGenerate(){
  const sch = state.schedule;
  let statusHtml = '';
  if(sch){
    if(sch.unscheduled.length===0){
      statusHtml = `<div class="ok">All lessons placed with no teacher clashes. Generated ${new Date(sch.generatedAt).toLocaleString()}.</div>`;
    } else {
      statusHtml = `<div class="warn"><b>${sch.unscheduled.length} lesson(s) could not be placed</b> after several attempts — usually means the week is too tight (too few periods before lunch, or a teacher over-committed). Consider reducing weekly counts, freeing up a teacher, or adding periods.<br><br>` +
        sch.unscheduled.map(u=>`• ${classById(u.classId)?.name || '?'} — ${subjById(u.subjectId)?.name || '?'}: ${u.reason}`).join('<br>') +
        `</div>`;
    }
  }
  return `
  <h1>Generate timetable</h1>
  <div class="hint">This runs the scheduler across every class and teacher at once, respecting all the rules, and tries multiple random arrangements to find the cleanest fit.</div>
  <div class="card">
    <button class="btn gold" id="run-generate">Generate timetable</button>
    ${state.classes.length===0 ? '<div class="warn" style="margin-top:12px;">Add classes, subjects, teachers and assignments first.</div>' : ''}
  </div>
  ${statusHtml}
  `;
}

function periodLabel(p, lunchAfter){ return `P${p}`; }

function buildDayColumns(){
  const {periodsPerDay, lunchAfter} = state.structure;
  const rows = [];
  for(let p=1;p<=periodsPerDay;p++){
    rows.push({type:'period', p});
    if(p===lunchAfter) rows.push({type:'lunch'});
  }
  return rows;
}

function renderResults(){
  if(!state.schedule){
    return `<h1>Timetables</h1><div class="warn">No timetable generated yet — go to Generate first.</div>`;
  }
  const subnav = `
    <div class="subtabs">
      <button class="subtab-btn ${currentResultsSub==='block'?'active':''}" data-rsub="block">Block timetable</button>
      <button class="subtab-btn ${currentResultsSub==='class'?'active':''}" data-rsub="class">Class timetable</button>
      <button class="subtab-btn ${currentResultsSub==='teacher'?'active':''}" data-rsub="teacher">Teacher timetable</button>
      <button class="btn small gold" id="print-all" style="margin-left:auto;">Print all timetables</button>
    </div>`;
  let body = '';
  if(currentResultsSub==='block') body = `<div class="toolbar" style="justify-content:flex-end;"><button class="btn small" id="print-current">Print this timetable</button></div>` + renderBlockTimetable();
  else if(currentResultsSub==='class') body = renderClassTimetable();
  else body = renderTeacherTimetable();
  return `<h1>Timetables</h1>${subnav}${body}`;
}

function renderBlockTimetable(){
  const {days} = state.structure;
  const rowsDef = buildDayColumns();
  const classGrid = state.schedule.classGrid;
  let html = `<div class="tt-wrap"><table class="tt"><tr><th>Day</th><th>Period</th>${state.classes.map(c=>`<th>${c.name}</th>`).join('')}</tr>`;
  days.forEach(day=>{
    rowsDef.forEach((r, ri)=>{
      if(r.type==='lunch'){
        html += `<tr><td class="period-label">${ri===0?day:''}</td><td class="lunch">LUNCH</td>${state.classes.map(()=>`<td class="lunch">—</td>`).join('')}</tr>`;
      } else {
        html += `<tr><td class="period-label">${firstPeriodRowOfDay(rowsDef, ri)? day : ''}</td><td class="period-label">${periodLabel(r.p)}</td>`;
        state.classes.forEach(c=>{
          const cell = classGrid[c.id][day][r.p];
          if(cell){
            const subj = subjById(cell.subjectId), t = teacherById(cell.teacherId);
            html += `<td class="cell ${subj?.ppi?'ppi':''}"><span class="s">${subj?subj.name:'?'}</span><span class="t">${t?t.name:''}</span></td>`;
          } else {
            html += `<td class="cell empty">–</td>`;
          }
        });
        html += `</tr>`;
      }
    });
  });
  html += `</table></div>`;
  return html;
}
function firstPeriodRowOfDay(rowsDef, ri){
  for(let i=0;i<ri;i++){ if(rowsDef[i].type==='period' && ri>0){} }
  // returns true only for the very first row (period 1) of that day's block
  return ri===0;
}

function buildClassTimetableTable(classId){
  const {days} = state.structure;
  const rowsDef = buildDayColumns();
  const classGrid = state.schedule.classGrid;
  let html = `<div class="tt-wrap"><table class="tt"><tr><th>Period</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>`;
  rowsDef.forEach(r=>{
    if(r.type==='lunch'){
      html += `<tr><td class="lunch">LUNCH</td>${days.map(()=>`<td class="lunch">—</td>`).join('')}</tr>`;
    } else {
      html += `<tr><td class="period-label">${periodLabel(r.p)}</td>`;
      days.forEach(day=>{
        const cell = classGrid[classId] ? classGrid[classId][day][r.p] : null;
        if(cell){
          const subj = subjById(cell.subjectId), t = teacherById(cell.teacherId);
          html += `<td class="cell ${subj?.ppi?'ppi':''}"><span class="s">${subj?subj.name:'?'}</span><span class="t">${t?t.name:''}</span></td>`;
        } else {
          html += `<td class="cell empty">–</td>`;
        }
      });
      html += `</tr>`;
    }
  });
  html += `</table></div>`;
  return html;
}

function renderClassTimetable(){
  if(!selectedClassId && state.classes.length) selectedClassId = state.classes[0].id;
  const opts = state.classes.map(c=>`<option value="${c.id}" ${c.id===selectedClassId?'selected':''}>${c.name}</option>`).join('');
  const toolbar = `<div class="toolbar"><select class="picker" id="class-picker" style="margin-bottom:0;">${opts}</select><button class="btn small" id="print-current">Print this timetable</button></div>`;
  return toolbar + buildClassTimetableTable(selectedClassId);
}

function buildTeacherTimetableTable(teacherId){
  const {days} = state.structure;
  const rowsDef = buildDayColumns();
  const classGrid = state.schedule.classGrid;
  const tgrid = {}; days.forEach(d=>tgrid[d]={});
  state.classes.forEach(c=>{
    days.forEach(day=>{
      Object.keys(classGrid[c.id][day]).forEach(p=>{
        const cell = classGrid[c.id][day][p];
        if(cell && cell.teacherId===teacherId){
          tgrid[day][p] = {classId:c.id, subjectId:cell.subjectId};
        }
      });
    });
  });
  let html = `<div class="tt-wrap"><table class="tt"><tr><th>Period</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>`;
  rowsDef.forEach(r=>{
    if(r.type==='lunch'){
      html += `<tr><td class="lunch">LUNCH</td>${days.map(()=>`<td class="lunch">—</td>`).join('')}</tr>`;
    } else {
      html += `<tr><td class="period-label">${periodLabel(r.p)}</td>`;
      days.forEach(day=>{
        const cell = tgrid[day][r.p];
        if(cell){
          const subj = subjById(cell.subjectId), c = classById(cell.classId);
          html += `<td class="cell ${subj?.ppi?'ppi':''}"><span class="s">${c?c.name:'?'}</span><span class="t">${subj?subj.name:''}</span></td>`;
        } else {
          html += `<td class="cell empty">–</td>`;
        }
      });
      html += `</tr>`;
    }
  });
  html += `</table></div>`;
  return html;
}

function renderTeacherTimetable(){
  if(!selectedTeacherId && state.teachers.length) selectedTeacherId = state.teachers[0].id;
  const opts = state.teachers.map(t=>`<option value="${t.id}" ${t.id===selectedTeacherId?'selected':''}>${t.name}</option>`).join('');
  const toolbar = `<div class="toolbar"><select class="picker" id="teacher-picker" style="margin-bottom:0;">${opts}</select><button class="btn small" id="print-current">Print this timetable</button></div>`;
  return toolbar + buildTeacherTimetableTable(selectedTeacherId);
}

// ---------- PRINT ----------
function schoolNameForPrint(){ return 'School Timetable'; }

function printHtml(sections){
  // sections: [{title, tableHtml}]
  const area = document.getElementById('print-area');
  area.innerHTML = sections.map(sec=>`
    <div class="print-page">
      <h2>${sec.title}</h2>
      ${sec.tableHtml}
    </div>`).join('');
  window.print();
}

function printAllTimetables(){
  if(!state.schedule) return;
  const sections = [{title:'Block Timetable — Whole School', tableHtml: renderBlockTimetable()}];
  state.classes.forEach(c=>{
    sections.push({title:`Class Timetable — ${c.name}`, tableHtml: buildClassTimetableTable(c.id)});
  });
  state.teachers.forEach(t=>{
    sections.push({title:`Teacher Timetable — ${t.name}`, tableHtml: buildTeacherTimetableTable(t.id)});
  });
  printHtml(sections);
}

function printCurrentView(){
  if(!state.schedule) return;
  if(currentResultsSub==='block'){
    printHtml([{title:'Block Timetable — Whole School', tableHtml: renderBlockTimetable()}]);
  } else if(currentResultsSub==='class'){
    const c = classById(selectedClassId);
    printHtml([{title:`Class Timetable — ${c?c.name:''}`, tableHtml: buildClassTimetableTable(selectedClassId)}]);
  } else {
    const t = teacherById(selectedTeacherId);
    printHtml([{title:`Teacher Timetable — ${t?t.name:''}`, tableHtml: buildTeacherTimetableTable(selectedTeacherId)}]);
  }
}

// ---------- HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

  if(currentTab==='structure'){
    const save = document.getElementById('save-structure');
    if(save) save.onclick = ()=>{
      const days = document.getElementById('f-days').value.split(',').map(s=>s.trim()).filter(Boolean);
      const periodsPerDay = parseInt(document.getElementById('f-periods').value,10);
      const lunchAfter = parseInt(document.getElementById('f-lunch').value,10);
      if(days.length<1 || !periodsPerDay || !lunchAfter){ alert('Please fill in all fields.'); return; }
      state.structure = {days, periodsPerDay, lunchAfter};
      state.schedule = null;
      saveState(); render();
    };
  }
  if(currentTab==='classes'){
    const add = document.getElementById('add-class');
    if(add) add.onclick=()=>{
      const name = document.getElementById('f-class-name').value.trim();
      const cat = document.getElementById('f-class-cat').value;
      if(!name) return;
      state.classes.push({id:uid(), name, category:cat});
      saveState(); render();
    };
    document.querySelectorAll('[data-del-class]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.delClass;
      state.classes = state.classes.filter(c=>c.id!==id);
      state.assignments = state.assignments.filter(a=>a.classId!==id);
      saveState(); render();
    });
  }
  if(currentTab==='subjects'){
    const add = document.getElementById('add-subject');
    if(add) add.onclick=()=>{
      const name = document.getElementById('f-subj-name').value.trim();
      const weekly = parseInt(document.getElementById('f-subj-weekly').value,10) || 1;
      const double = document.getElementById('f-subj-double').checked;
      const maths = document.getElementById('f-subj-maths').checked;
      const ppi = document.getElementById('f-subj-ppi').checked;
      if(!name) return;
      state.subjects.push({id:uid(), name, weekly: ppi?1:weekly, double, maths, ppi});
      saveState(); render();
    };
    document.querySelectorAll('[data-del-subject]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.delSubject;
      state.subjects = state.subjects.filter(s=>s.id!==id);
      state.assignments = state.assignments.filter(a=>a.subjectId!==id);
      saveState(); render();
    });
  }
  if(currentTab==='teachers'){
    const add = document.getElementById('add-teacher');
    if(add) add.onclick=()=>{
      const name = document.getElementById('f-teacher-name').value.trim();
      if(!name) return;
      state.teachers.push({id:uid(), name});
      saveState(); render();
    };
    document.querySelectorAll('[data-del-teacher]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.delTeacher;
      state.teachers = state.teachers.filter(t=>t.id!==id);
      state.assignments = state.assignments.filter(a=>a.teacherId!==id);
      saveState(); render();
    });
  }
  if(currentTab==='assignments'){
    const add = document.getElementById('add-assignment');
    if(add) add.onclick=()=>{
      const classId = document.getElementById('f-a-class').value;
      const subjectId = document.getElementById('f-a-subject').value;
      const teacherId = document.getElementById('f-a-teacher').value;
      const weeklyRaw = document.getElementById('f-a-weekly').value;
      const weekly = weeklyRaw ? parseInt(weeklyRaw,10) : undefined;
      state.assignments.push({id:uid(), classId, subjectId, teacherId, weekly});
      saveState(); render();
    };
    document.querySelectorAll('[data-del-assign]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.delAssign;
      state.assignments = state.assignments.filter(a=>a.id!==id);
      saveState(); render();
    });
  }
  if(currentTab==='generate'){
    const run = document.getElementById('run-generate');
    if(run) run.onclick = ()=>{
      run.disabled = true; run.textContent = 'Generating…';
      setTimeout(()=>{
        generateSchedule();
        render();
      }, 30);
    };
  }
  if(currentTab==='results'){
    document.querySelectorAll('[data-rsub]').forEach(b=>b.onclick=()=>{ currentResultsSub=b.dataset.rsub; render(); });
    const cp = document.getElementById('class-picker');
    if(cp) cp.onchange = ()=>{ selectedClassId = cp.value; render(); };
    const tp = document.getElementById('teacher-picker');
    if(tp) tp.onchange = ()=>{ selectedTeacherId = tp.value; render(); };
    const pa = document.getElementById('print-all');
    if(pa) pa.onclick = printAllTimetables;
    const pc = document.getElementById('print-current');
    if(pc) pc.onclick = printCurrentView;
  }
}
